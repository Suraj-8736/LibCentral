<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cdbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="45%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>
    <linearGradient id="dragonBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#cdbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.4"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#f87171" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#dragonBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">PEARSON HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#7f1d1d" stroke="#f87171" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMPILER DESIGN</text>
  <text x="310" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#fca5a5" text-anchor="middle" letter-spacing="1">PRINCIPLES, TECHNIQUES, &amp; TOOLS</text>
  <text x="310" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fecaca" text-anchor="middle">Second Edition • The Classic Dragon Book</text>

  <!-- Authors Card -->
  <rect x="40" y="218" width="520" height="68" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f87171" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="300" y="244" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ALFRED V. AHO • MONICA S. LAM</text>
  <text x="300" y="268" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="0.5">RAVI SETHI • JEFFREY D. ULLMAN</text>

  <!-- Central Graphic Showcase (6-Phase Compiler Pipeline) -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="500" height="348" rx="18" fill="#1c1917" stroke="#f87171" stroke-width="1.5"/>

    <!-- Compiler Pipeline Steps -->
    <g transform="translate(45, 18)">
      <rect x="0" y="0" width="390" height="32" rx="6" fill="#991b1b"/><text x="195" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1. LEXICAL ANALYSIS (Lex / Tokens / DFA)</text>
      <rect x="0" y="38" width="390" height="32" rx="6" fill="#b91c1c"/><text x="195" y="59" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">2. SYNTAX ANALYSIS (LL/LR Parsers, Yacc)</text>
      <rect x="0" y="76" width="390" height="32" rx="6" fill="#c2410c"/><text x="195" y="97" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3. SEMANTIC ANALYSIS &amp; SDT</text>
      <rect x="0" y="114" width="390" height="32" rx="6" fill="#d97706"/><text x="195" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">4. INTERMEDIATE CODE GENERATION (3AC / TAC)</text>
      <rect x="0" y="152" width="390" height="32" rx="6" fill="#059669"/><text x="195" y="173" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">5. CODE OPTIMIZATION (DAG, Loops, Peephole)</text>
      <rect x="0" y="190" width="390" height="32" rx="6" fill="#0284c7"/><text x="195" y="211" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">6. TARGET CODE GENERATION (Assembly / Register Alloc)</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="248" width="450" height="85" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="250" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">Symbol Tables • Runtime Storage Environments • Register Allocation</text>
    <text x="250" y="302" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">Prescribed Standard Syllabus for Compiler Design (CS / IT)</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#dragonBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PEARSON EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fecaca" text-anchor="middle">The Definitive Dragon Book for Computer Science Scholars</text>
</svg>