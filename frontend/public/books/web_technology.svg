<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="wtbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="oxfordBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#093568"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#wtbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#a855f7" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#oxfordBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">OXFORD UNIVERSITY PRESS</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#6d28d9" stroke="#c084fc" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WEB TECHNOLOGY</text>
  <text x="310" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">HTML5 • CSS3 • JAVASCRIPT • PHP • SERVLETS</text>
  <text x="310" y="202" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e9d5ff" text-anchor="middle">Theory, Architecture &amp; Full-Stack Web Programming</text>

  <!-- Authors Card -->
  <rect x="80" y="224" width="460" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#glowBorder)" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="259" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">UTTAM K. ROY</text>

  <!-- Central Graphic Showcase (Browser Window Mockup + Tech Stacks) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#8b5cf6" stroke-width="1.5"/>

    <!-- Browser Window Header -->
    <rect x="0" y="0" width="500" height="38" rx="18" fill="#1e1b4b"/>
    <circle cx="25" cy="19" r="6" fill="#ef4444"/>
    <circle cx="45" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="19" r="6" fill="#10b981"/>
    <rect x="90" y="8" width="320" height="22" rx="6" fill="#0f172a"/>
    <text x="250" y="23" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">https://www.university-library.edu/web-tech</text>

    <!-- Tech Badges inside Browser -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#e44d26"/>
      <text x="65" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">HTML5 / DOM</text>

      <rect x="150" y="0" width="135" height="36" rx="8" fill="#264de4"/>
      <text x="217" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">CSS3 / FLEXBOX</text>

      <rect x="305" y="0" width="145" height="36" rx="8" fill="#f7df1e"/>
      <text x="377" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#000" text-anchor="middle">JAVASCRIPT ES6+</text>
    </g>

    <g transform="translate(25, 105)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#777bb4"/>
      <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">PHP &amp; MySQL</text>

      <rect x="150" y="0" width="135" height="34" rx="8" fill="#0284c7"/>
      <text x="217" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">SERVLETS / JSP</text>

      <rect x="305" y="0" width="145" height="34" rx="8" fill="#059669"/>
      <text x="377" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">XML, AJAX &amp; JSON</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="160" width="450" height="165" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(192,132,252,0.2)"/>
    <text x="250" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">HTTP Protocol • Web Servers (Apache/Tomcat) • Client-Server Model</text>
    <text x="250" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">DOM Tree Manipulation • Event Handling • AJAX Asynchronous Calls</text>
    <text x="250" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Java Servlets Lifecycle • Session Tracking (Cookies/HttpSession) • JSP</text>
    <text x="250" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">RESTful Web Services • SOAP/WSDL Architecture • Web Security</text>
    <text x="250" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">Prescribed for AKTU &amp; Major Technical Universities</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#oxfordBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">OXFORD UNIVERSITY PRESS</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" text-anchor="middle">Authoritative Academic Edition for Web Technology &amp; Applications</text>
</svg>
