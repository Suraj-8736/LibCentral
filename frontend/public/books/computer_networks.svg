<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cnbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="indigoBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#cnbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#indigoBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">McGRAW HILL HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMPUTER NETWORKS</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">DATA COMMUNICATIONS &amp; NETWORKING</text>
  <text x="310" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" text-anchor="middle">Fifth Edition • Core Prescribed University Textbook</text>

  <!-- Authors Card -->
  <rect x="80" y="222" width="460" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="258" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1.5">BEHROUZ A. FOROUZAN</text>

  <!-- Central Graphic Showcase (7-Layer OSI & TCP/IP Model Stack) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>

    <!-- OSI Layers Visualization -->
    <g transform="translate(35, 16)">
      <rect x="0" y="0" width="410" height="26" rx="6" fill="#312e81"/><text x="205" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">7. APPLICATION LAYER (HTTP, DNS, SMTP, FTP)</text>
      <rect x="0" y="30" width="410" height="26" rx="6" fill="#3730a3"/><text x="205" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">6. PRESENTATION LAYER (TLS/SSL, Compression, Encoding)</text>
      <rect x="0" y="60" width="410" height="26" rx="6" fill="#4338ca"/><text x="205" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">5. SESSION LAYER (Sockets, Dialog Control, Token Mgmt)</text>
      <rect x="0" y="90" width="410" height="26" rx="6" fill="#4f46e5"/><text x="205" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4. TRANSPORT LAYER (TCP 3-Way Handshake, UDP, Congestion)</text>
      <rect x="0" y="120" width="410" height="26" rx="6" fill="#6366f1"/><text x="205" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3. NETWORK LAYER (IPv4/IPv6, OSPF, BGP, Routers, Subnetting)</text>
      <rect x="0" y="150" width="410" height="26" rx="6" fill="#818cf8"/><text x="205" y="168" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e1b4b" text-anchor="middle">2. DATA LINK LAYER (Ethernet, CSMA/CD, Error CRC, Switches)</text>
      <rect x="0" y="180" width="410" height="26" rx="6" fill="#a5b4fc"/><text x="205" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e1b4b" text-anchor="middle">1. PHYSICAL LAYER (Fiber, Twisted Pair, Signals, Multiplexing)</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="235" width="450" height="95" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(129,140,248,0.2)"/>
    <text x="250" y="262" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">Socket Programming • Error Detection (CRC) • Flow &amp; Error Control</text>
    <text x="250" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Routing Protocols: Distance Vector, Link State • Wireless 802.11</text>
    <text x="250" y="314" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Network Security • Cryptography • Firewalls &amp; VPN Architecture</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#indigoBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">McGRAW HILL EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" text-anchor="middle">Authoritative Global Reference on Computer Networks by Forouzan</text>
</svg>