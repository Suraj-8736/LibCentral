<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="hvbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="hvgol" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#hvbg)"/>
  <rect width="20" height="800" fill="black" opacity="0.25"/>

  <rect x="0" y="0" width="600" height="55" fill="#0f766e"/>
  <text x="300" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">A FOUNDATION COURSE IN HUMAN VALUES</text>

  <text x="300" y="140" font-family="sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">UNIVERSAL HUMAN VALUES</text>
  <text x="300" y="180" font-family="sans-serif" font-size="24" font-weight="800" fill="#5eead4" text-anchor="middle">&amp; PROFESSIONAL ETHICS</text>
  <text x="300" y="215" font-family="sans-serif" font-size="14" fill="#ccfbf1" text-anchor="middle">Harmony in Individual, Family, Society and Nature</text>

  <!-- Authors -->
  <rect x="100" y="240" width="400" height="60" rx="16" fill="rgba(0,0,0,0.3)" stroke="#5eead4" stroke-width="1.5"/>
  <text x="300" y="265" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">R.R. GAUR • R. SANGAL • G.P. BAGARIA</text>
  <text x="300" y="288" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">&amp; R. ASTHANA</text>

  <!-- Harmony Diagram (Four Levels) -->
  <g transform="translate(100, 330)">
    <circle cx="200" cy="170" r="150" fill="none" stroke="rgba(250,204,21,0.2)" stroke-width="2"/>
    <circle cx="200" cy="170" r="115" fill="none" stroke="rgba(94,234,212,0.3)" stroke-width="2"/>
    <circle cx="200" cy="170" r="80" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <circle cx="200" cy="170" r="45" fill="#0d9488" stroke="#facc15" stroke-width="3"/>

    <text x="200" y="175" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">SELF (I)</text>
    <text x="200" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">FAMILY</text>
    <text x="200" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">SOCIETY</text>
    <text x="200" y="40" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">NATURE / EXISTENCE</text>
  </g>

  <rect x="50" y="680" width="500" height="75" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="300" y="712" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">EXCEL BOOKS PUBLISHERS</text>
  <text x="300" y="738" font-family="sans-serif" font-size="12" fill="#99f6e4" text-anchor="middle">Self-Exploration • Continuous Happiness • Right Understanding</text>
</svg>