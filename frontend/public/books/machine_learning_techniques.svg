<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="mlbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#mlbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#goldBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">McGRAW HILL HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#b45309" stroke="#fbbf24" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MACHINE LEARNING</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">TECHNIQUES</text>
  <text x="310" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="middle">Foundations, Statistical Models &amp; Deep Learning</text>

  <!-- Authors Card -->
  <rect x="80" y="224" width="460" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="259" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TOM M. MITCHELL</text>

  <!-- Central Graphic Showcase (Neural Nodes + Hyperplane Classification) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#d97706" stroke-width="1.5"/>

    <!-- Classification Scatter Plot & Neural Network Nodes -->
    <g transform="translate(30, 20)">
      <!-- Axis -->
      <line x1="20" y1="130" x2="220" y2="130" stroke="#475569" stroke-width="2"/>
      <line x1="20" y1="130" x2="20" y2="10" stroke="#475569" stroke-width="2"/>
      
      <!-- SVM Hyperplane Decision Boundary -->
      <line x1="30" y1="120" x2="210" y2="20" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
      
      <!-- Class 1 Dots (Blue) -->
      <circle cx="50" cy="50" r="7" fill="#38bdf8"/>
      <circle cx="80" cy="35" r="7" fill="#38bdf8"/>
      <circle cx="70" cy="70" r="7" fill="#38bdf8"/>
      <circle cx="100" cy="55" r="7" fill="#38bdf8"/>

      <!-- Class 2 Dots (Pink) -->
      <rect x="140" y="80" width="13" height="13" rx="2" fill="#ec4899"/>
      <rect x="170" y="65" width="13" height="13" rx="2" fill="#ec4899"/>
      <rect x="155" y="105" width="13" height="13" rx="2" fill="#ec4899"/>
      <rect x="190" y="90" width="13" height="13" rx="2" fill="#ec4899"/>

      <text x="120" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">SVM Optimal Margin</text>
    </g>

    <!-- Neural Network Mini Graph on Right -->
    <g transform="translate(270, 20)">
      <!-- Input Layer -->
      <circle cx="30" cy="30" r="10" fill="#3b82f6"/>
      <circle cx="30" cy="70" r="10" fill="#3b82f6"/>
      <circle cx="30" cy="110" r="10" fill="#3b82f6"/>

      <!-- Hidden Layer -->
      <circle cx="100" cy="20" r="10" fill="#8b5cf6"/>
      <circle cx="100" cy="55" r="10" fill="#8b5cf6"/>
      <circle cx="100" cy="90" r="10" fill="#8b5cf6"/>
      <circle cx="100" cy="125" r="10" fill="#8b5cf6"/>

      <!-- Output Layer -->
      <circle cx="170" cy="50" r="10" fill="#10b981"/>
      <circle cx="170" cy="95" r="10" fill="#10b981"/>

      <!-- Synapse Lines -->
      <line x1="30" y1="30" x2="100" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="30" y1="30" x2="100" y2="55" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="30" y1="70" x2="100" y2="55" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="30" y1="70" x2="100" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="30" y1="110" x2="100" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="30" y1="110" x2="100" y2="125" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

      <line x1="100" y1="55" x2="170" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="100" y1="90" x2="170" y2="95" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

      <text x="100" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">Deep Neural Net</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="165" width="450" height="160" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.2)"/>
    <text x="250" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">Supervised &amp; Unsupervised Learning • Decision Trees (ID3 / C4.5)</text>
    <text x="250" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Bayesian Learning • Naive Bayes • Support Vector Machines (SVM)</text>
    <text x="250" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Artificial Neural Networks • Backpropagation • Gradient Descent</text>
    <text x="250" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Clustering (K-Means, Hierarchical) • Random Forests • Q-Learning</text>
    <text x="250" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Core Prescribed Curriculum for Machine Learning &amp; AI</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#goldBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">McGRAW HILL EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fef3c7" text-anchor="middle">Authoritative Academic Reference on Machine Learning Techniques</text>
</svg>
