<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="sebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="tealBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#sebg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#tealBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">PEARSON HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#0f766e" stroke="#5eead4" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SOFTWARE ENGINEERING</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="1.5">PROCESSES, ARCHITECTURE &amp; DEVOPS</text>
  <text x="310" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ccfbf1" text-anchor="middle">Tenth Edition • Global Benchmark Textbook</text>

  <!-- Authors Card -->
  <rect x="80" y="222" width="460" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#2dd4bf" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="258" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1.5">IAN SOMMERVILLE</text>

  <!-- Central Graphic Showcase (Agile Iteration Loop & UML Architecture) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#0f766e" stroke-width="1.5"/>

    <!-- Agile Sprint Iteration Loop -->
    <g transform="translate(140, 20)">
      <circle cx="110" cy="55" r="45" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="10 5"/>
      <polygon points="155,55 145,45 145,65" fill="#2dd4bf"/>
      <text x="110" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">AGILE SCRUM</text>
      <text x="110" y="68" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fde047" text-anchor="middle">SPRINT CYCLE</text>
    </g>

    <!-- SDLC Phase Boxes -->
    <g transform="translate(25, 115)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#0f766e"/><text x="40" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">1. Plan</text>
      <rect x="92" y="0" width="80" height="28" rx="6" fill="#0d9488"/><text x="132" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">2. Design</text>
      <rect x="184" y="0" width="80" height="28" rx="6" fill="#14b8a6"/><text x="224" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#042f2e" text-anchor="middle">3. Code</text>
      <rect x="276" y="0" width="80" height="28" rx="6" fill="#2dd4bf"/><text x="316" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#042f2e" text-anchor="middle">4. Test</text>
      <rect x="368" y="0" width="80" height="28" rx="6" fill="#5eead4"/><text x="408" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#042f2e" text-anchor="middle">5. Deploy</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="160" width="450" height="165" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(45,212,191,0.2)"/>
    <text x="250" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">Software Processes (Waterfall, Spiral, Agile Scrum, Kanban)</text>
    <text x="250" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#5eead4" text-anchor="middle">Requirements Engineering: Functional &amp; Non-Functional, SRS Documents</text>
    <text x="250" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">System Modeling • UML Class, Sequence &amp; State Diagrams • Microservices</text>
    <text x="250" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Software Testing: White-Box, Black-Box, Integration &amp; CI/CD Pipelines</text>
    <text x="250" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ccfbf1" text-anchor="middle">Software Reliability • Quality Assurance (CMMI, ISO) • Maintenance</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#tealBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PEARSON EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ccfbf1" text-anchor="middle">The World's Most Trusted Authority on Software Engineering Principles</text>
</svg>