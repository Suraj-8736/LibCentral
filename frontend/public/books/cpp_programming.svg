<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cppbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="blueBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#cppbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#blueBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">McGRAW HILL HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">C++ PROGRAMMING</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">OBJECT-ORIENTED PROGRAMMING WITH C++</text>
  <text x="310" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#bae6fd" text-anchor="middle">Eighth Edition • India's Highest Rated C++ Manual</text>

  <!-- Authors Card -->
  <rect x="80" y="222" width="460" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="258" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">E. BALAGURUSAMY</text>

  <!-- Central Graphic Showcase (C++ Hex Badge + OOP Hierarchy) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1.5"/>

    <!-- C++ Hexagon Emblem -->
    <g transform="translate(60, 30)">
      <!-- Hexagon Outer -->
      <polygon points="50,5 95,30 95,80 50,105 5,80 5,30" fill="#00599c" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="50" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">C++</text>
    </g>

    <!-- OOP Structure Diagram on Right -->
    <g transform="translate(195, 20)">
      <!-- Base Class -->
      <rect x="70" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="140" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">class BaseClass</text>

      <!-- Derived Classes -->
      <rect x="0" y="70" width="130" height="32" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="65" y="90" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">DerivedA : public</text>

      <rect x="150" y="70" width="130" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="215" y="90" font-family="monospace" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">DerivedB : virtual</text>

      <!-- Connecting arrows -->
      <line x1="140" y1="32" x2="140" y2="50" stroke="#38bdf8" stroke-width="2"/>
      <line x1="65" y1="50" x2="215" y2="50" stroke="#38bdf8" stroke-width="2"/>
      <line x1="65" y1="50" x2="65" y2="70" stroke="#4ade80" stroke-width="2"/>
      <line x1="215" y1="50" x2="215" y2="70" stroke="#f59e0b" stroke-width="2"/>

      <text x="140" y="125" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">Inheritance &amp; Polymorphism</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="160" width="450" height="165" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(56,189,248,0.2)"/>
    <text x="250" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">Classes &amp; Objects • Constructors, Destructors &amp; Copy Semantics</text>
    <text x="250" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Operator Overloading • Type Conversions • Pointers &amp; `this` Pointer</text>
    <text x="250" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Virtual Functions • Pure Virtuals &amp; Abstract Base Classes (ABCs)</text>
    <text x="250" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">C++ Templates (Function &amp; Class) • Exception Handling (try-catch)</text>
    <text x="250" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#bae6fd" text-anchor="middle">Standard Template Library (STL): Vectors, Maps, Sets &amp; Iterators</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#blueBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">McGRAW HILL EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f0f9ff" text-anchor="middle">India's Definitive Benchmark Textbook for C++ and Object-Oriented Design</text>
</svg>
