    <text x="85" y="205" font-family="monospace" font-size="14" fill="#e2e8f0">return [x * 2 for x in data if x > 0]</text>

    <text x="25" y="250" font-family="monospace" font-size="14" fill="#e2e8f0">records = np.array([12, 45, 78, 90])</text>
