<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="coibg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="tricolorAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#coibg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.4"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#goldBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">LEXISNEXIS • LAW &amp; GOVERNANCE SERIES</text>

  <!-- Tricolor Accent Ribbon -->
  <rect x="0" y="54" width="600" height="6" fill="url(#tricolorAccent)"/>

  <!-- Year / Semester Tag -->
  <g transform="translate(410, 72)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#b45309" stroke="#fbbf24" stroke-width="1"/>
    <text x="75" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR (KNC501)</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CONSTITUTION OF INDIA</text>
  <text x="310" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="2">LAW, ETHICS &amp; ENGINEERING GOVERNANCE (COI)</text>
  <text x="310" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fef08a" text-anchor="middle">Introduction to the Constitution of India • 26th Edition</text>

  <!-- Authors Card -->
  <rect x="60" y="220" width="500" height="64" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="246" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DR. DURGA DAS BASU (D.D. BASU)</text>
  <text x="310" y="270" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="0.5">&amp; DR. B.R. AMBEDKAR (CHIEF ARCHITECT)</text>

  <!-- Central Graphic Showcase (Emblem, Scales of Justice & Preamble Pillar) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#d97706" stroke-width="1.5"/>

    <!-- Scales of Justice Symbol -->
    <g transform="translate(250, 65)">
      <!-- Central Pillar -->
      <line x1="0" y1="-35" x2="0" y2="40" stroke="#f59e0b" stroke-width="4"/>
      <ellipse cx="0" cy="40" rx="25" ry="8" fill="#d97706"/>
      <circle cx="0" cy="-35" r="8" fill="#fbbf24"/>
      
      <!-- Balance Beam -->
      <line x1="-70" y1="-25" x2="70" y2="-25" stroke="#f59e0b" stroke-width="3"/>
      
      <!-- Left Pan -->
      <line x1="-70" y1="-25" x2="-90" y2="10" stroke="#fde68a" stroke-width="1.5"/>
      <line x1="-70" y1="-25" x2="-50" y2="10" stroke="#fde68a" stroke-width="1.5"/>
      <path d="M -95 10 Q -70 25 -45 10 Z" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>

      <!-- Right Pan -->
      <line x1="70" y1="-25" x2="50" y2="10" stroke="#fde68a" stroke-width="1.5"/>
      <line x1="70" y1="-25" x2="90" y2="10" stroke="#fde68a" stroke-width="1.5"/>
      <path d="M 45 10 Q 70 25 95 10 Z" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>

      <!-- Ashoka Chakra Mini Center -->
      <circle cx="0" cy="5" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="5" r="3" fill="#38bdf8"/>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="145" width="450" height="180" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.2)"/>
    <text x="250" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">The Preamble: Sovereign, Socialist, Secular, Democratic Republic</text>
    <text x="250" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Fundamental Rights (Articles 12-35) &amp; Fundamental Duties (Article 51A)</text>
    <text x="250" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Directive Principles of State Policy (DPSP - Articles 36-51)</text>
    <text x="250" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Union &amp; State Executive • Parliamentary System • Supreme Court &amp; High Courts</text>
    <text x="250" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">Engineering Ethics • Cyber Laws &amp; IT Act 2000 • Intellectual Property Rights (IPR)</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#goldBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">LEXISNEXIS BUTTERWORTHS</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fef3c7" text-anchor="middle">Mandatory Prescribed Course for Engineering &amp; Technology Students</text>
</svg>
