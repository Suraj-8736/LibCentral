<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bdbbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cyanBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#bdbbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#cyanBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">WILEY INDIA HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#0e7490" stroke="#22d3ee" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">BIG DATA</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#22d3ee" text-anchor="middle" letter-spacing="2">BIG DATA ANALYTICS &amp; DISTRIBUTED SYSTEMS</text>
  <text x="310" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#cffafe" text-anchor="middle">Architecture, Hadoop HDFS, Spark, MapReduce &amp; NoSQL</text>

  <!-- Authors Card -->
  <rect x="50" y="222" width="520" height="58" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="258" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="0.5">SEEMA ACHARYA &amp; SUBHASHINI CHELLAPPAN</text>

  <!-- Central Graphic Showcase (5Vs of Big Data + Hadoop Spark Ecosystem) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#0891b2" stroke-width="1.5"/>

    <!-- 5Vs Badges -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="84" height="38" rx="8" fill="#0284c7"/><text x="42" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">VOLUME</text>
      <rect x="94" y="0" width="84" height="38" rx="8" fill="#0d9488"/><text x="136" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">VELOCITY</text>
      <rect x="188" y="0" width="84" height="38" rx="8" fill="#7c3aed"/><text x="230" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">VARIETY</text>
      <rect x="282" y="0" width="84" height="38" rx="8" fill="#d97706"/><text x="324" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">VERACITY</text>
      <rect x="376" y="0" width="84" height="38" rx="8" fill="#e11d48"/><text x="418" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">VALUE</text>
    </g>

    <!-- Hadoop & Spark Stack -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="200" height="52" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
      <text x="100" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fde047" text-anchor="middle">APACHE HADOOP</text>
      <text x="100" y="42" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">HDFS &amp; MapReduce v2</text>

      <rect x="220" y="0" width="200" height="52" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="320" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#fb923c" text-anchor="middle">APACHE SPARK</text>
      <text x="320" y="42" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">RDD, DataFrames &amp; PySpark</text>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="145" width="450" height="180" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(6,182,212,0.2)"/>
    <text x="250" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">Big Data Ecosystem &amp; 5V Characteristics • Distributed Storage</text>
    <text x="250" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="middle">Hadoop Distributed File System (HDFS): NameNode, DataNodes, Block Replication</text>
    <text x="250" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">MapReduce Programming Paradigm: Mapper, Reducer, Combiner, Partitioner</text>
    <text x="250" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Apache Spark In-Memory Computing: RDD Transformations &amp; Actions</text>
    <text x="250" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#cffafe" text-anchor="middle">Hive QL • Pig Latin • NoSQL Databases (HBase, MongoDB, Cassandra)</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#cyanBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WILEY INDIA PUBLISHING</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cffafe" text-anchor="middle">Core Prescribed Reference for Big Data Analytics &amp; Cloud Infrastructure</text>
</svg>
