<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="dbbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#dbbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#goldBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">McGRAW HILL HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DATABASE MANAGEMENT</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">SYSTEMS</text>
  <text x="310" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#bae6fd" text-anchor="middle">Database System Concepts • 7th Edition</text>

  <!-- Authors Card -->
  <rect x="55" y="222" width="510" height="66" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ABRAHAM SILBERSCHATZ • HENRY F. KORTH</text>
  <text x="310" y="272" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="0.5">&amp; S. SUDARSHAN</text>

  <!-- Central Graphic Showcase -->
  <g transform="translate(60, 306)">
    <rect x="0" y="0" width="500" height="340" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Database 3D Stack Cylinders -->
    <g transform="translate(180, 25)">
      <!-- Cylinder 1 (Base) -->
      <path d="M 0 50 C 0 35 140 35 140 50 L 140 100 C 140 115 0 115 0 100 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="70" cy="50" rx="70" ry="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Cylinder 2 (Middle) -->
      <path d="M 0 25 C 0 10 140 10 140 25 L 140 50 C 140 65 0 65 0 50 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="70" cy="25" rx="70" ry="16" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Cylinder 3 (Top) -->
      <path d="M 0 0 C 0 -15 140 -15 140 0 L 140 25 C 140 40 0 40 0 25 Z" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="2"/>
      <ellipse cx="70" cy="0" rx="70" ry="16" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      
      <text x="70" y="4" font-family="monospace" font-size="12" font-weight="900" fill="#082f49" text-anchor="middle">RELATIONAL DB</text>
      <text x="70" y="78" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SQL • ACID</text>
    </g>

    <!-- Schema nodes -->
    <g transform="translate(40, 45)">
      <rect x="0" y="0" width="105" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="52" y="18" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">TABLE: Users</text>
      <text x="52" y="32" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PK: user_id</text>
    </g>

    <g transform="translate(355, 45)">
      <rect x="0" y="0" width="105" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="52" y="18" font-family="monospace" font-size="10" font-weight="bold" fill="#fde047" text-anchor="middle">TABLE: Orders</text>
      <text x="52" y="32" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FK: user_id</text>
    </g>

    <!-- Connecting relationship lines -->
    <line x1="145" y1="66" x2="180" y2="66" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="320" y1="66" x2="355" y2="66" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Key Topics Card -->
    <rect x="25" y="165" width="450" height="150" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(56,189,248,0.2)"/>
    <text x="250" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">Relational Data Model • SQL Queries • Normalization (1NF to BCNF)</text>
    <text x="250" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Transaction Processing • Concurrency Control (2PL, Timestamp)</text>
    <text x="250" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Indexing &amp; Hashing (B+ Trees) • Query Evaluation &amp; Optimization</text>
    <text x="250" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Database Recovery • NoSQL Concepts • Distributed Architectures</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#goldBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">McGRAW HILL EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fef3c7" text-anchor="middle">The Gold Standard Prescribed University Textbook for DBMS</text>
</svg>
