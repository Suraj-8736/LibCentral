<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="spmbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGoldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="600" height="800" fill="url(#spmbg)"/>
  
  <!-- Spine Texture -->
  <rect width="22" height="800" fill="#000000" opacity="0.35"/>
  <line x1="22" y1="0" x2="22" y2="800" stroke="#fb923c" stroke-width="1" opacity="0.4"/>

  <!-- Top Publisher Banner -->
  <rect x="0" y="0" width="600" height="54" fill="url(#orangeGoldBanner)"/>
  <text x="310" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">McGRAW HILL HIGHER EDUCATION</text>

  <!-- Year / Semester Tag -->
  <g transform="translate(420, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#9a3412" stroke="#fdba74" stroke-width="1"/>
    <text x="70" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3RD YEAR CORE</text>
  </g>

  <!-- Main Title Block -->
  <text x="310" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SOFTWARE PROJECT</text>
  <text x="310" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#fb923c" text-anchor="middle" letter-spacing="2">MANAGEMENT (SPM)</text>
  <text x="310" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffedd5" text-anchor="middle">Fifth Edition • Planning, Effort Estimation, Execution &amp; Control</text>

  <!-- Authors Card -->
  <rect x="50" y="222" width="520" height="62" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f97316" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="310" y="246" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BOB HUGHES • MIKE COTTERELL</text>
  <text x="310" y="268" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="0.5">&amp; RAJIB MALL</text>

  <!-- Central Graphic Showcase (Gantt Timeline + PERT Network + Risk Matrix) -->
  <g transform="translate(60, 302)">
    <rect x="0" y="0" width="500" height="345" rx="18" fill="rgba(15, 23, 42, 0.9)" stroke="#c2410c" stroke-width="1.5"/>

    <!-- Gantt Chart Miniature -->
    <g transform="translate(30, 20)">
      <!-- Task 1 -->
      <rect x="0" y="0" width="85" height="18" rx="4" fill="#1e293b"/>
      <text x="42" y="13" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Feasibility</text>
      <rect x="95" y="2" width="90" height="14" rx="3" fill="#3b82f6"/>

      <!-- Task 2 -->
      <rect x="0" y="25" width="85" height="18" rx="4" fill="#1e293b"/>
      <text x="42" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Estimation</text>
      <rect x="150" y="27" width="100" height="14" rx="3" fill="#f59e0b"/>

      <!-- Task 3 -->
      <rect x="0" y="50" width="85" height="18" rx="4" fill="#1e293b"/>
      <text x="42" y="63" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Dev Sprint</text>
      <rect x="220" y="52" width="130" height="14" rx="3" fill="#10b981"/>

      <!-- Task 4 -->
      <rect x="0" y="75" width="85" height="18" rx="4" fill="#1e293b"/>
      <text x="42" y="88" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">QA &amp; Release</text>
      <rect x="320" y="77" width="110" height="14" rx="3" fill="#ec4899"/>
    </g>

    <!-- Key Topics Card -->
    <rect x="25" y="135" width="450" height="190" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(249,115,22,0.2)"/>
    <text x="250" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fde047" text-anchor="middle">Project Planning &amp; Evaluation • Cost-Benefit Analysis (ROI, NPV)</text>
    <text x="250" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fb923c" text-anchor="middle">Software Effort Estimation: COCOMO Models &amp; Function Point Analysis (FPA)</text>
    <text x="250" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Activity Planning: PERT / CPM Networks &amp; Critical Path Identification</text>
    <text x="250" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">Risk Assessment &amp; Management • Risk Exposure Matrices &amp; Mitigation</text>
    <text x="250" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">Resource Allocation • Monitoring &amp; Earned Value Analysis (EVA)</text>
    <text x="250" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffedd5" text-anchor="middle">Managing People &amp; Organizing Teams in Agile Scrum Environments</text>
  </g>

  <!-- Bottom Publisher Seal -->
  <rect x="40" y="670" width="535" height="80" rx="16" fill="url(#orangeGoldBanner)" filter="url(#shadow)"/>
  <text x="307" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">McGRAW HILL EDUCATION</text>
  <text x="307" y="732" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffedd5" text-anchor="middle">The Definitive Prescribed Textbook for Software Project Management</text>
</svg>
